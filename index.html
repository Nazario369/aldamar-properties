<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Aldamar Properties | Sitio temporalmente no disponible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090D;--gold:#C9A468;--gold-light:#E4CDA0;--bone:#F2EFE9;--bone-dim:#9C9A94}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--bone);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;background:radial-gradient(ellipse at 50% 20%,rgba(201,164,104,0.14),transparent 60%),#09090D}
.box{max-width:640px;width:100%}
img{display:block;max-width:100%;height:auto;margin:0 auto}
.mark{height:clamp(80px,14vw,120px);width:auto;margin-bottom:22px}
.word{height:clamp(26px,5vw,38px);width:auto;margin-bottom:56px}
.line{width:48px;height:1px;background:var(--gold);margin:0 auto 40px;opacity:.8}
h1{font-family:'Cormorant',serif;font-weight:500;font-size:clamp(30px,6vw,46px);line-height:1.2;color:var(--bone);margin-bottom:16px}
p{color:var(--bone-dim);font-weight:400;font-size:15px;line-height:1.7;max-width:460px;margin:0 auto}
.en{margin-top:44px;padding-top:36px;border-top:1px solid #26292F}
.en h2{font-family:'Cormorant',serif;font-weight:500;font-size:clamp(22px,4vw,28px);color:var(--gold-light);margin-bottom:10px}
.tag{margin-top:56px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--bone-dim)}
</style>
</head>
<body>
<main class="box">
<img class="mark" src="aldamar-mark.png" alt="">
<img class="word" src="aldamar-word.png" alt="Aldamar">
<div class="line"></div>
<h1>Sitio temporalmente no disponible</h1>
<p>Estamos realizando ajustes en nuestra página. Muy pronto volveremos a estar en línea.</p>
<div class="en">
<h2>Site temporarily unavailable</h2>
<p>We are making some adjustments to our website. We will be back online very soon.</p>
</div>
<div class="tag">— Live Beyond —</div>
</main>
</body>
</html>
